# ============================================================
# TaskView Kanban - flujo de desarrollo (develop / qa / main)
# Copiar en cada repo de codigo como: .github/workflows/taskview.yml
#
# Requisito en el repo (Settings -> Secrets and variables -> Actions):
#   Secret   TASKVIEW_TOKEN    token tvk_... de TaskView
#
# Columnas del proyecto en TaskView, EN ESTE ORDEN (ver docs/github-kanban.md):
#   Backlog -> Dev -> Review -> QA -> Done
#
# Proceso:
#   Backlog   manual: la tarea se crea y se asigna
#   Dev       se crea la rama con el codigo: tv-12-login (historia) o tv-13-api (subtarea)
#   Review    se abre un PR (subtarea -> historia, historia -> develop / qa)
#   QA        se mergea un PR a qa
#   (develop) mergear a develop no mueve nada: queda integrado
#   Done      se mergea un PR a main (develop -> main o historia -> main) = en produccion
#
# En los merges a qa / main se leen tambien los commits del PR, asi
# develop -> main mueve todas las historias y subtareas que lleva dentro.
# Nunca retrocede: si una tarea ya esta en QA, abrir otro PR no la regresa a Review.
#
# Codigo de tarea = ID en TaskView (menu de la tarea -> Copy task ID).
# ============================================================

name: TaskView Kanban

on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  kanban:
    # "create" tambien se dispara con tags; solo nos interesan ramas
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: johannhsdev/taskview/github-action@v1
        with:
          api-url: https://tasks-api.slasdevelopments.com
          token: ${{ secrets.TASKVIEW_TOKEN }}

          # ----------------------------------------------
          # Reglas:  evento[@rama-destino] = Columna[, complete][, force]
          #   eventos: branch, pr_draft, pr_opened, pr_merged, pr_closed
          #   rama destino acepta * (release/*). Gana la primera que coincide.
          #   columna vacia = no mover. complete = marcar completada.
          #   force = permite retroceder (ignora only-forward).
          # ----------------------------------------------
          rules: |
            branch            = Dev
            pr_draft          =
            pr_opened         = Review
            pr_merged@qa      = QA
            pr_merged@main    = Done, complete
            pr_merged@develop =
            pr_merged         =
            pr_closed         =

          # No mover tarjetas hacia atras segun el orden de columnas
          only-forward: 'true'

          # Leer codigos de tarea en los commits del PR (develop -> main)
          scan-commits: 'true'

          # Con este flujo conviene crear las columnas a mano y en orden
          create-missing-columns: 'false'

          # Codigo de tarea (grupo 1 = ID). Por defecto: tv-123
          # task-pattern: '(?:^|[^a-z0-9])tv[-_ ](\d+)(?![0-9])'

          fail-on-error: 'false'
