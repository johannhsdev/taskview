name: TaskView Kanban
description: Mueve tarjetas del Kanban de TaskView segun ramas y pull requests de GitHub.
author: johannhsdev

branding:
  icon: columns
  color: green

inputs:
  api-url:
    description: URL publica del API de TaskView (ej. https://tasks-api.slasdevelopments.com)
    required: true
  token:
    description: Token de API de TaskView (tvk_...). Guardarlo como secret del repo.
    required: true
  task-pattern:
    description: Regex (sin flags, se aplica case-insensitive) con un grupo que captura el ID de la tarea.
    required: false
    default: '(?:^|[^a-z0-9])tv[-_ ](\d+)(?![0-9])'
  rules:
    description: >
      Reglas, una por linea: "<evento>[@<rama-destino>] = <Columna>[, complete][, force]".
      Eventos: branch, pr_draft, pr_opened, pr_merged, pr_closed. La rama acepta * (ej. release/*).
      Gana la primera regla que coincide; columna vacia = no mover. Si se define, reemplaza a las
      opciones *-column y complete-on-merge.
    required: false
    default: ''
  only-forward:
    description: >
      No mover tarjetas hacia atras segun el orden de columnas del proyecto (una regla con "force" lo ignora).
      Vacio = true si se usan rules, false en el modo de opciones *-column (comportamiento v1).
    required: false
    default: ''
  scan-commits:
    description: En eventos de PR, buscar tambien codigos de tarea en los mensajes de commits del PR (necesario para develop -> main).
    required: false
    default: 'true'
  github-token:
    description: Token para leer los commits del PR. Requiere permissions contents:read y pull-requests:read.
    required: false
    default: ${{ github.token }}
  branch-created-column:
    description: Columna al crear una rama con el codigo de la tarea. Vacio = no mover.
    required: false
    default: In Progress
  pr-draft-column:
    description: Columna al abrir un PR en draft o pasarlo a draft. Vacio = no mover.
    required: false
    default: ''
  pr-opened-column:
    description: Columna al abrir, reabrir o marcar listo un PR. Vacio = no mover.
    required: false
    default: Review
  pr-merged-column:
    description: Columna al mergear el PR. Vacio = no mover.
    required: false
    default: Done
  pr-closed-column:
    description: Columna al cerrar un PR sin mergear. Vacio = no mover.
    required: false
    default: ''
  complete-on-merge:
    description: Marcar la tarea como completada al mergear el PR.
    required: false
    default: 'true'
  create-missing-columns:
    description: Crear la columna en el proyecto si no existe.
    required: false
    default: 'true'
  fail-on-error:
    description: Fallar el job si TaskView responde con error (por defecto solo advierte).
    required: false
    default: 'false'

outputs:
  task-ids:
    description: IDs de tareas detectados, separados por coma.
  column:
    description: Columna destino aplicada.

runs:
  using: node24
  main: index.mjs
